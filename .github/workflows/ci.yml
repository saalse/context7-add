name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    # Pinned: setup-python has no Python 3.8 or 3.9 builds for newer Ubuntu images.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax check
        run: python -m py_compile skills/context7-add/scripts/c7.py
      - name: Tests (offline, API stubbed)
        run: python -m unittest discover -s tests -v

  skill:
    name: Skill and coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install "skills-ref==0.1.1" "coverage==7.17.4"
      - name: Validate the skill (Agent Skills specification)
        run: agentskills validate skills/context7-add
      - name: Coverage
        run: |
          python -m coverage run --source=skills/context7-add/scripts -m unittest discover -s tests
          python -m coverage report -m
          python -m coverage report -m --format=markdown >> "$GITHUB_STEP_SUMMARY"
