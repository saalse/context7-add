name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python: "3.8"  # the oldest version SKILL.md promises; not built for ubuntu-24.04
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax check
        run: python -m py_compile skills/context7-add/scripts/c7.py
      - name: Tests (offline, API stubbed)
        run: python -m unittest discover -s tests -v

  skill:
    name: Skill and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install "skills-ref==0.1.1" "coverage==7.6.1"
      - name: Validate the skill (Agent Skills specification)
        run: agentskills validate skills/context7-add
      - name: Coverage
        run: |
          python -m coverage run --source=skills/context7-add/scripts -m unittest discover -s tests
          python -m coverage report -m
